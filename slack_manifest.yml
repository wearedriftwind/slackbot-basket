# Slack-appens manifest. Skapa appen via https://api.slack.com/apps → Create New App → From a manifest.
display_information:
  name: Biljettboten
  description: Driftwinds två biljetter till Luleå Basket
  background_color: "#1d3a6e"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: biljetter
    always_online: true
  slash_commands:
    - command: /biljetter
      description: Boka, avboka och se Driftwinds biljetter till Luleå Basket
      usage_hint: "[nästa | boka Alvik | avboka | status 18 dec | besök | statistik | synka | hjälp]"
      should_escape: true
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - app_mentions:read
      - im:history
      - im:read
      - im:write
      - channels:read
      - groups:read
      - files:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
